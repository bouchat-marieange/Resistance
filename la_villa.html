<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résistance — La Villa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Epilogue:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Epilogue', 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Fond particules ── */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Conteneur central ── */
        .villa-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 520px;
            width: 90%;
            padding: 0 16px;
        }

        /* ── Logo ── */
        .villa-logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 24px rgba(0,229,255,0.25));
            animation: logoFloat 3.5s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        /* ── Titre Bebas Neue ── */
        .villa-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(48px, 8vw, 88px);
            letter-spacing: .04em;
            color: #00E5FF;
            line-height: 1;
            margin-bottom: 32px;
            text-shadow: 0 0 30px rgba(0,229,255,0.25);
        }

        /* ── Carte encadrée ── */
        .villa-card {
            background: rgba(13, 17, 23, 0.92);
            border: 1px solid #1C2A38;
            border-radius: 14px;
            padding: 36px 40px;
            width: 100%;
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 48px rgba(0,0,0,0.6),
                        0 0 0 1px rgba(0,229,255,0.06);
            position: relative;
            overflow: hidden;
        }

        /* Trait cyan gauche */
        .villa-card::before {
            content: '';
            position: absolute;
            left: 0; top: 20%; bottom: 20%;
            width: 3px;
            background: linear-gradient(to bottom, transparent, #00E5FF, transparent);
            border-radius: 2px;
        }

        /* ── Badge ── */
        .villa-badge {
            display: inline-block;
            font-family: 'Epilogue', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #0a0a0a;
            background: #00E5FF;
            border-radius: 3px;
            padding: 3px 10px;
            margin-bottom: 22px;
        }

        /* ── Message principal ── */
        .villa-msg {
            font-size: 16px;
            font-weight: 400;
            color: #C8D8E8;
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .villa-msg strong {
            color: #eef4ff;
            font-weight: 600;
        }

        /* ── Sous-message ── */
        .villa-hint {
            font-size: 13px;
            color: #607080;
            font-style: italic;
            letter-spacing: .02em;
            line-height: 1.6;
        }

        /* ── Bouton retour ── */
        .villa-back {
            display: inline-block;
            margin-top: 28px;
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #607080;
            border: 1px solid #1C2A38;
            border-radius: 6px;
            text-decoration: none;
            transition: color .2s, border-color .2s;
        }

        .villa-back:hover {
            color: #00E5FF;
            border-color: #00E5FF;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .villa-card { padding: 28px 24px; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="villa-container">

    <img class="villa-logo" src="images/lapin fond transpa.png" alt="Résistance">

    <div class="villa-title">La Villa</div>

    <div class="villa-card">
        <div class="villa-badge">En construction</div>

        <p class="villa-msg">
            Cette pièce est actuellement en cours de développement.<br>
            <strong>La Résistance y travaille activement.</strong>
        </p>

        <p class="villa-hint">
            Le bunker s'agrandit, les alliances se tissent.<br>
            Revenez bientôt — quelque chose se prépare ici.
        </p>
    </div>

    <a class="villa-back" href="sas_securite.html">← Retour au sas de sécurité</a>

</div>

<script src="game/core/env.js"></script>
<script src="game/core/profiles.js"></script>
<script src="game/core/video-gate.js"></script>
<script src="game/core/page-boot.js"></script>

<script>
/* ── Animation particules (identique à l'écran de démarrage) ── */
(function () {
    var canvas = document.getElementById('bg-canvas');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var PARTICLE_COUNT = 70;

    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for (var i = 0; i < PARTICLE_COUNT; i++) {
        var bright = Math.random() < 0.2;
        particles.push({
            x:    Math.random() * canvas.width,
            y:    Math.random() * canvas.height,
            vx:   (Math.random() - 0.5) * 0.35,
            vy:   (Math.random() - 0.5) * 0.35,
            r:    bright ? Math.random() * 2 + 2 : Math.random() * 1.5 + 0.8,
            a:    bright ? Math.random() * 0.3 + 0.65 : Math.random() * 0.35 + 0.35,
            glow: bright ? 10 : 5
        });
    }

    function animateBg() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0)            p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0)             p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;

            ctx.shadowBlur  = p.glow;
            ctx.shadowColor = 'rgba(0, 229, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 229, 255, ' + p.a + ')';
            ctx.fill();
        });
        ctx.shadowBlur = 0;
        requestAnimationFrame(animateBg);
    }
    animateBg();
})();
</script>

</body>
</html>
